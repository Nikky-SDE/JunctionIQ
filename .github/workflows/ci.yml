name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and test API
        working-directory: api
        run: |
          npm ci
          npm test

      - name: Run preprocessing unit tests
        working-directory: scripts
        run: npm test

      - name: Typecheck and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
